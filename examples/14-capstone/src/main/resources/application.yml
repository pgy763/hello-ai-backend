spring:
  datasource:
    url: jdbc:h2:mem:capstone;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always

server:
  port: 8080

capstone:
  retry:
    max-attempts: 3
  limiter:
    capacity: 5
    refill-per-second: 2
  pricing:
    # 示例单价，不是任何厂商的真实报价
    big-in-per-million: 2.0
    big-out-per-million: 8.0
    small-in-per-million: 0.5
    small-out-per-million: 1.0

logging:
  level:
    helloai.capstone: info