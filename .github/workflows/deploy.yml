name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  # PR 也要构建：交叉引用写错、frontmatter 坏了，VitePress 会在构建期报死链，
  # 但不能等到合并进 main 才发现 —— 那时站点已经挂了
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时，由这一步自动创建 Pages 站点。
          # 需要 workflow 拥有 pages: write 权限（见文件顶部的 permissions）。
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    # PR 只验证能不能构建，不往 Pages 上推
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
